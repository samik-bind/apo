# Public docs overlay (SPEC-171) — project-operated public documentation.
#
# Optional: only the project operator's public deployment uses this. Self-hosters
# consume the central docs at https://docs.test-apo.online; they do not each
# publish them. Selected by `scripts/apo-mode tunnel`, layered over the tunnel
# Compose stack.
#
# The docs service is static, secret-free, read-only, and capability-less. It
# never receives an Apo credential, repository mount, host port, or database.

services:
  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/start.md"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    environment:
      - APO_DOCS_HOST=${APO_DOCS_HOST:?Set APO_DOCS_HOST to the public docs hostname}
    depends_on:
      docs:
        condition: service_healthy
